version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rideet-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: rideet-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mssql
      DB_NAME: rideet
      DB_USERNAME: sa
      DB_PASSWORD: "YourStrong@Passw0rd"
      JWT_SECRET: "RideEtSuperSecretKeyForJWTTokenGenerationMinimum256BitsLong"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-placeholder}
    depends_on:
      mssql:
        condition: service_healthy
    restart: on-failure

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: rideet-admin
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mssql_data:
