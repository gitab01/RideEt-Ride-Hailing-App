name: rideet_driver
description: RideEt - Driver App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.4
  equatable: ^2.0.5
  go_router: ^13.2.0
  dio: ^5.4.1
  stomp_dart_client: ^1.1.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  cupertino_icons: ^1.0.6
  material_symbols_icons: ^4.2719.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
