name: rideet_user
description: RideEt - Passenger App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.1

  # WebSocket (STOMP)
  stomp_dart_client: ^3.0.1

  # Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Storage
  flutter_secure_storage: ^9.0.0

  # Payments
  flutter_stripe: ^10.1.1

  # UI
  intl: ^0.19.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
