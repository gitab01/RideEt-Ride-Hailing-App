name: rideet_user
description: RideEt - Passenger App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.2.0

  # HTTP
  dio: ^5.4.1
  retrofit: ^4.1.0

  # WebSocket (STOMP)
  stomp_dart_client: ^1.1.0

  # Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Payments
  flutter_stripe: ^10.1.1

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_rating_bar: ^4.0.1
  pin_code_fields: ^8.0.1

  # Utils
  intl: ^0.19.0
  permission_handler: ^11.3.0
  image_picker: ^1.0.7
  url_launcher: ^6.2.5

  # Icons
  cupertino_icons: ^1.0.6
  material_symbols_icons: ^4.2719.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  retrofit_generator: ^8.1.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
